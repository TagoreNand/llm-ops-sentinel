name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.11
        activate-environment: llm-ops-sentinel
        auto-activate-base: false
    
    - name: Install dependencies with Conda + Pip
      shell: bash -l {0}
      run: |
        # Conda handles all the complex scientific packages
        conda install -c conda-forge -y hdbscan numpy cython scikit-learn sentence-transformers umap-learn
        
        # Pip handles the rest
        pip install -r requirements.txt
    
    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest tests/ -v --cov=app --cov-report=term-missing
