name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3.11-dev python3.11-distutils gcc g++ build-essential
    
    - name: Install pip and build tools FIRST
      run: |
        python3.11 -m pip install --upgrade pip setuptools wheel
    
    - name: Install Cython SECOND (required for hdbscan)
      run: |
        python3.11 -m pip install cython
    
    - name: Install numpy THIRD (required for hdbscan)
      run: |
        python3.11 -m pip install numpy==1.24.3
    
    - name: Install hdbscan FOURTH (now dependencies are ready)
      run: |
        python3.11 -m pip install hdbscan==0.8.33 --no-build-isolation
    
    - name: Install remaining requirements
      run: |
        python3.11 -m pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python3.11 -m pytest tests/ -v
