name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3.11-dev python3.11-distutils gcc g++ build-essential
    
    - name: Install Python dependencies (using pre-compiled wheels)
      run: |
        python3.11 -m pip install --upgrade pip setuptools wheel
        
        # Install numpy and cython first
        python3.11 -m pip install numpy==1.24.3 cython
        
        # Install hdbscan from pre-compiled wheel (no compilation needed!)
        python3.11 -m pip install --only-binary=hdbscan hdbscan==0.8.33
        
        # Install the rest of requirements
        python3.11 -m pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python3.11 -m pytest tests/ -v --ignore=tests/test_drift.py
